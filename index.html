<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokéDex TCG — My Collection</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/468.png" alt="Togekiss" />
    Poké<span>TCG</span>
  </div>
  <div class="tab-bar">
    <button class="active" onclick="switchTab('search')">Search</button>
    <button onclick="switchTab('collection')">Collection</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="collection-count"><strong id="col-count">0</strong> cards</div>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">🌙</button>
  </div>
</header>

<main>
  <!-- Search tab -->
  <div id="tab-search">
    <div class="search-mode-row">
      <button class="mode-btn active" id="mode-name" onclick="setSearchMode('name')">By Name</button>
      <button class="mode-btn" id="mode-artist" onclick="setSearchMode('artist')">By Artist</button>
      <button class="mode-btn" id="mode-set" onclick="setSearchMode('set')">By Set</button>
    </div>
    <div id="search-row-wrap">
    <div class="search-row">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search by Pokémon name…"
               autocorrect="off" autocapitalize="none" spellcheck="false"
               onkeydown="if(event.key==='Enter') searchMode==='set' ? fetchSetCards() : doSearch()" />
      </div>
      <button class="random-btn" id="random-btn" onclick="randomCard()" title="Show a random card">🎲</button>
      <button class="search-btn" id="search-btn" onclick="searchMode==='set' ? fetchSetCards() : doSearch()">Search</button>
    </div>
    </div>
    <div class="filter-row" id="type-filters">
      <span>Type:</span>
    </div>

    <!-- Set picker (shown in set mode) -->
    <div id="set-picker-wrap" style="display:none;margin-bottom:20px;position:relative">
      <div class="search-wrap" style="flex:1">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none">
          <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        </svg>
        <input type="search" id="set-filter-input" placeholder="Filter sets…"
               autocorrect="off" autocapitalize="none" spellcheck="false"
               style="padding-left:44px"
               oninput="filterSetList()" />
      </div>
      <div id="set-list" class="set-list"></div>
    </div>
    <div id="results-toolbar" style="display:none" class="results-toolbar">
      <span id="results-count" class="results-count"></span>
      <button class="add-all-btn" id="add-all-btn" onclick="addAllToCollection()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span id="add-all-label">Add all to collection</span>
      </button>
    </div>
    <div id="search-results"></div>
    <div class="pagination hidden" id="pagination">
      <button id="prev-btn" onclick="changePage(-1)">← Prev</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn" onclick="changePage(1)">Next →</button>
    </div>
  </div>

  <!-- Collection tab -->
  <div id="tab-collection" style="display:none">
    <div class="collections-bar" id="collections-bar"></div>
    <div class="col-toolbar">
      <button class="hide-owned-btn" id="hide-owned-btn" onclick="toggleHideOwned()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        Hide owned
      </button>
    </div>
    <div id="collection-grid"></div>
  </div>
</main>

<!-- Card detail modal -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalIfBg(event)">
  <div class="modal" id="modal">
    <div class="modal-close"><button onclick="closeModal()">✕</button></div>
    <div class="modal-inner" id="modal-inner"></div>
  </div>
</div>

<!-- Collection picker modal (for "Add all") -->
<div class="modal-overlay hidden" id="col-picker-overlay" onclick="closeColPickerIfBg(event)">
  <div class="modal" id="col-picker-modal" style="max-width:420px">
    <div class="modal-close"><button onclick="closeColPicker()">✕</button></div>
    <div style="padding:4px 20px 24px">
      <div style="font-family:'Exo 2',sans-serif;font-weight:800;font-size:1.2rem;margin-bottom:6px">Add all to…</div>
      <div id="col-picker-count" style="font-size:0.82rem;color:var(--muted);margin-bottom:16px"></div>
      <div id="col-picker-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu" style="display:none"></div>

<!-- Collection complete celebration -->
<div class="celebrate-overlay hidden" id="celebrate-overlay" onclick="closeCelebration()">
  <div class="celebrate-modal">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-title">Collection Complete!</div>
    <div class="celebrate-sub" id="celebrate-sub"></div>
    <button class="celebrate-btn" onclick="closeCelebration()">Woohoo!</button>
  </div>
  <canvas id="confetti-canvas"></canvas>
</div>
<script src="script.js"></script>

</body>
</html>
